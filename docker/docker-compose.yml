x-ros-base: &ros-base 
  build: .
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - ${PWD}:/workspace
  environment:
    - DISPLAY=${DISPLAY}
    - TURTLEBOT3_MODEL=burger
    - ROS_DOMAIN_ID=82
    - SDL_JOYSTICK_HIDAPI=0
  ipc: host
  network_mode: host
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # gazebo:
  #   <<: *ros-base
  #   container_name: turtlebot3_gazebo
  #   command: ros2 launch turtlebot3_gazebo turtlebot3_world.launch.py

  slam:
    <<: *ros-base
    container_name: turtlebot3_slam
    command: ros2 launch turtlebot3_cartographer cartographer.launch.py use_sim_time:=False
